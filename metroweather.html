<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Weather App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      font-family: Arial, sans-serif;
      transition: 0.5s;
      padding: 20px;
    }

    .dark-body {
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
    }

    .weather-card {
      width: 420px;
      max-width: 95%;
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.3);
      transition: 0.5s;
    }

    .dark-card {
      background: #1e1e1e;
      color: white;
    }

    .title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .city {
      font-size: 38px;
      font-weight: bold;
      margin-top: 10px;
    }

    .temp {
      font-size: 70px;
      font-weight: bold;
      margin-top: 10px;
    }

    .weather {
      font-size: 26px;
      margin-top: 10px;
      text-transform: capitalize;
      font-weight: bold;
    }

    .info {
      font-size: 18px;
      margin-top: 8px;
    }

    img {
      width: 120px;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .form-control {
      height: 50px;
      font-size: 18px;
      border-radius: 12px;
    }

    button {
      height: 50px;
      border-radius: 12px !important;
      font-size: 16px !important;
    }
  </style>
</head>

<body>

  <div class="weather-card" id="card">

    <div class="title"> Weather App</div>

    <input type="text" id="cityInput" class="form-control" placeholder="Enter City Name">

    <div class="top-buttons">
      <button class="btn btn-primary w-100" onclick="getWeather()">Search</button>
      <button class="btn btn-dark" onclick="darkMode()">🌙</button>
      <button class="btn btn-warning" onclick="voiceSearch()">🎤</button>
    </div>

    <div class="mt-4">
      <div class="city" id="city">--</div>

      <div class="info" id="dateTime"></div>

      <img id="icon" src="" alt="">

      <div class="temp" id="temp">--°C</div>

      <div class="weather" id="weather">---</div>

      <div class="info" id="feels"></div>
      <div class="info" id="humidity"></div>
      <div class="info" id="wind"></div>
      <div class="info" id="sunrise"></div>
      <div class="info" id="sunset"></div>
    </div>

  </div>

<script>

let apiKey = "3d91f4aa9ae0ea561f181c947637cc34";

// TIME
function updateTime() {
  let now = new Date();

  let days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  document.getElementById("dateTime").innerHTML =
    ` ${now.toLocaleDateString()} <br>
      ${days[now.getDay()]} <br>
      ${now.toLocaleTimeString()}`;
}

setInterval(updateTime, 1000);
updateTime();

// WEATHER
async function getWeather() {

  let city = document.getElementById("cityInput").value;

  if (city === "") {
    alert("Please Enter City Name");
    return;
  }

  let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  try {

    let response = await fetch(url);
    let data = await response.json();

    if (data.cod == "404") {
      alert("City Not Found");
      return;
    }

    showWeather(data);

  } catch (error) {
    alert("Internet Error");
  }
}

// SHOW WEATHER
function showWeather(data) {

  document.getElementById("city").innerText = data.name;
  document.getElementById("temp").innerText = Math.round(data.main.temp) + "°C";
  document.getElementById("weather").innerText = data.weather[0].description;

  document.getElementById("feels").innerText =
    "🌡 Feels Like : " + Math.round(data.main.feels_like) + "°C";

  document.getElementById("humidity").innerText =
    "💧 Humidity : " + data.main.humidity + "%";

  document.getElementById("wind").innerText =
    "🌬 Wind Speed : " + data.wind.speed + " km/h";

  // ✅ FIXED 12 HOUR FORMAT
  let sunrise = new Date(data.sys.sunrise * 1000);
  let sunset = new Date(data.sys.sunset * 1000);

  document.getElementById("sunrise").innerText =
    "🌅 Sunrise : " +
    sunrise.toLocaleTimeString('en-US', {
      hour: 'numeric',
      minute: 'numeric',
      second: 'numeric',
      hour12: true
    });

  document.getElementById("sunset").innerText =
    "🌇 Sunset : " +
    sunset.toLocaleTimeString('en-US', {
      hour: 'numeric',
      minute: 'numeric',
      second: 'numeric',
      hour12: true
    });

  let icon = data.weather[0].icon;
  document.getElementById("icon").src =
    `https://openweathermap.org/img/wn/${icon}@2x.png`;
}

// DARK MODE
function darkMode() {
  document.body.classList.toggle("dark-body");
  document.getElementById("card").classList.toggle("dark-card");
}

// VOICE SEARCH
function voiceSearch() {

  if (!('webkitSpeechRecognition' in window)) {
    alert("Voice Search Not Supported");
    return;
  }

  let recognition = new webkitSpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = function (event) {
    let city = event.results[0][0].transcript;
    document.getElementById("cityInput").value = city;
    getWeather();
  }
}

</script>

</body>
</html>
